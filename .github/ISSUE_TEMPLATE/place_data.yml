name: Place data problem
description: A place is missing, mislabelled, in the wrong spot, or linked to the wrong article
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Marker positions and categories live in `public/data/Faerun/*.json`; the
        article each marker points at is mirrored under
        `public/data/Faerun/wiki/`. 18 of the 297 markers point at pages the wiki
        does not have — those places still get a page that says so, which is
        expected rather than a bug.

        Factual errors *inside* an article belong upstream at the
        [Forgotten Realms Wiki](https://forgottenrealms.fandom.com/); this mirror
        reflects what it published.

  - type: input
    id: place
    attributes:
      label: Which place?
      placeholder: "Baldur's Gate"
    validations:
      required: true

  - type: dropdown
    id: problem
    attributes:
      label: What is wrong?
      options:
        - It is in the wrong position on the map
        - It is missing entirely
        - The name or spelling is wrong
        - It is in the wrong category
        - It links to the wrong wiki article
        - Something else
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: What should it be instead?
      description: >
        For a position, a description relative to nearby places is fine — "north
        bank of the Chionthar, not the south" is more useful than coordinates.
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Source
      description: >
        Which map or sourcebook backs this. The tiles are the 3rd-edition Faerûn
        map, so editions can legitimately disagree.
    validations:
      required: false
