<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Faerûn · Post Map</title>
    <!--
      OpenLayers is bundled from npm by Vite; ol.css and app.css are imported
      from src/main.js so they hot-reload in dev. No CDN import map.
      Tiles are a full @2x pyramid (z0–z6), so OL fetches only the handful of
      tiles each view needs — no eager whole-pyramid preload required.
    -->
</head>
<body>
    <header class="topbar">
        <button id="sidebar-toggle" class="icon-btn" aria-label="Toggle sidebar" title="Toggle sidebar">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                <rect x="2" y="3"  width="12" height="1.6" rx="0.5" fill="currentColor"/>
                <rect x="2" y="7"  width="12" height="1.6" rx="0.5" fill="currentColor"/>
                <rect x="2" y="11" width="12" height="1.6" rx="0.5" fill="currentColor"/>
            </svg>
        </button>
        <span class="brand">Post Map<span class="brand-sub">Faerûn</span></span>
        <span class="spacer"></span>
    </header>

    <aside id="sidebar" class="sidebar"></aside>

    <div id="map"></div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
